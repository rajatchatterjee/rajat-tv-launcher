name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # ubuntu-latest runners already ship with the Android SDK
        # (ANDROID_HOME/ANDROID_SDK_ROOT preinstalled). We only need to
        # accept the licenses before Gradle's own SDK components can
        # install. We deliberately don't use android-actions/setup-android
        # here — it tries to install the long-removed legacy 'tools'
        # package and fails.
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug testDebugUnitTest lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a GitHub Release with the APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Artifacts from "Upload APK" above require a GitHub login to
        # download, and the resulting link is Azure blob storage, which
        # some networks/sandboxes block. A Release asset is a plain,
        # permanent github.com URL anyone can download or use directly
        # in a tool like the Android TV "Downloader" app.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
